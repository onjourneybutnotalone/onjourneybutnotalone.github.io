<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | On a Journey, But Not Alone</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#1f5f63" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --cream:#fbf7f0; --sand:#f2e9da; --ink:#1f2a33; --muted:#55616b; --teal:#1f5f63; --teal-dark:#164649; --gold:#d9a441; --gold-soft:#f4dfb4; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Source Sans 3", system-ui, sans-serif; font-size:1.125rem; line-height:1.65; color:var(--ink);
      background:linear-gradient(180deg, var(--cream) 0%, var(--gold-soft) 100%); min-height:100vh; display:flex; flex-direction:column; }
    header { border-bottom:1px solid var(--sand); background:rgba(251,247,240,.95); }
    .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
    .brand { display:inline-block; line-height:64px; font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.15rem; color:var(--ink); text-decoration:none; }
    .brand span { color:var(--teal); }
    main { flex:1; display:flex; align-items:center; padding:50px 0; }
    .box { max-width:600px; margin:0 auto; text-align:center; }
    svg { width:100%; max-width:340px; height:auto; margin:0 auto 24px; display:block; }
    .eyebrow { font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); font-weight:600; margin-bottom:10px; }
    h1 { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(2rem, 5vw, 2.8rem); line-height:1.2; margin-bottom:16px; }
    p { color:var(--muted); margin-bottom:28px; }
    .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-block; padding:13px 24px; border-radius:999px; font-weight:600; text-decoration:none; font-size:1rem; }
    .btn-primary { background:var(--teal); color:#fff; }
    .btn-primary:hover { background:var(--teal-dark); }
    .btn-ghost { border:2px solid var(--teal); color:var(--teal); }
    .btn-ghost:hover { background:var(--teal); color:#fff; }
    footer { padding:28px 0; text-align:center; color:var(--muted); font-size:.95rem; }
    footer a { color:var(--teal); }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><a href="/" class="brand">On a Journey, <span>But Not Alone</span></a></div>
  </header>
  <main>
    <div class="wrap box">
      <svg viewBox="0 0 500 300" role="img" aria-label="A winding road leading toward a rising sun">
        <circle cx="330" cy="110" r="90" fill="#d9a441" opacity=".18"/>
        <circle cx="330" cy="110" r="60" fill="#d9a441" opacity=".9"/>
        <path d="M0 170 Q120 120 250 160 T500 140 V300 H0Z" fill="#9fbfb4"/>
        <path d="M0 210 Q150 170 280 200 T500 190 V300 H0Z" fill="#4f8a83"/>
        <path d="M0 250 Q160 225 300 245 T500 240 V300 H0Z" fill="#1f5f63"/>
        <path d="M150 300 C210 260 330 255 300 220 C287 203 318 185 332 170 L342 170 C332 188 310 203 322 220 C350 258 260 275 255 300Z" fill="#f2e9da"/>
      </svg>
      <p class="eyebrow">Page not found</p>
      <h1>This page wandered off the path.</h1>
      <p>The page you were looking for isn't here, but you're still in the right place. Let's get you back on the road.</p>
      <div class="btns">
        <a href="/" class="btn btn-primary">Back to Home</a>
        <a href="/#contact" class="btn btn-ghost">Reach Out</a>
      </div>
    </div>
  </main>
  <footer>
    <p>If you are in crisis, call or text <a href="tel:988">988</a> (Suicide &amp; Crisis Lifeline), available 24/7.</p>
  </footer>
</body>
</html>
